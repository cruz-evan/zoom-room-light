name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZOOM_WEBHOOK_SECRET_TOKEN: ${{ secrets.ZOOM_WEBHOOK_SECRET_TOKEN }}
      ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
      ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
      ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
      ZOOM_SCHEDULE_USER_ID: ${{ secrets.ZOOM_SCHEDULE_USER_ID }}
      SCHEDULE_LOOKAHEAD_MINUTES: ${{ secrets.SCHEDULE_LOOKAHEAD_MINUTES }}
      SCHEDULE_POLL_SECONDS: ${{ secrets.SCHEDULE_POLL_SECONDS }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check Cloudflare secrets
        id: cloudflare
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare deploy skipped: add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.cloudflare.outputs.deploy == 'true'
        run: npm ci

      - name: Typecheck Worker
        if: steps.cloudflare.outputs.deploy == 'true'
        run: npm run typecheck

      - name: Sync Cloudflare Worker secrets
        if: steps.cloudflare.outputs.deploy == 'true'
        run: |
          set -eu

          put_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "Skipping empty secret: $name"
            fi
          }

          put_secret ZOOM_WEBHOOK_SECRET_TOKEN "$ZOOM_WEBHOOK_SECRET_TOKEN"
          put_secret ZOOM_ACCOUNT_ID "$ZOOM_ACCOUNT_ID"
          put_secret ZOOM_CLIENT_ID "$ZOOM_CLIENT_ID"
          put_secret ZOOM_CLIENT_SECRET "$ZOOM_CLIENT_SECRET"
          put_secret ZOOM_SCHEDULE_USER_ID "$ZOOM_SCHEDULE_USER_ID"
          put_secret SCHEDULE_LOOKAHEAD_MINUTES "$SCHEDULE_LOOKAHEAD_MINUTES"
          put_secret SCHEDULE_POLL_SECONDS "$SCHEDULE_POLL_SECONDS"

      - name: Deploy Worker and Container
        if: steps.cloudflare.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
