name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "cloudflare-worker/**"
  pull_request:
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "cloudflare-worker/**"
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZOOM_WEBHOOK_SECRET_TOKEN: ${{ secrets.ZOOM_WEBHOOK_SECRET_TOKEN }}
      ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
      ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
      ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
      ZOOM_SCHEDULE_USER_ID: ${{ secrets.ZOOM_SCHEDULE_USER_ID }}
      MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
      MICROSOFT_CALENDAR_USER_ID: ${{ secrets.MICROSOFT_CALENDAR_USER_ID }}
      DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      POLL_SECONDS: ${{ vars.POLL_SECONDS || secrets.POLL_SECONDS }}
      SCHEDULE_LOOKAHEAD_MINUTES: ${{ vars.SCHEDULE_LOOKAHEAD_MINUTES || secrets.SCHEDULE_LOOKAHEAD_MINUTES }}
      ACTIVE_MEETING_LOOKAHEAD_MINUTES: ${{ vars.ACTIVE_MEETING_LOOKAHEAD_MINUTES }}
      EMPTY_ROOM_LOOKAHEAD_MINUTES: ${{ vars.EMPTY_ROOM_LOOKAHEAD_MINUTES }}
      ENDING_SOON_MINUTES: ${{ vars.ENDING_SOON_MINUTES || secrets.ENDING_SOON_MINUTES }}

    defaults:
      run:
        working-directory: cloudflare-worker

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Worker tests
        run: npm test

      - name: Check deployment credentials
        id: cloudflare
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "Cloudflare deploy skipped for pull requests."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare deploy skipped: add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Sync Worker secrets
        if: steps.cloudflare.outputs.deploy == 'true'
        run: |
          set -eu

          put_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "Skipping empty secret: $name"
            fi
          }

          put_secret ZOOM_WEBHOOK_SECRET_TOKEN "$ZOOM_WEBHOOK_SECRET_TOKEN"
          put_secret ZOOM_ACCOUNT_ID "$ZOOM_ACCOUNT_ID"
          put_secret ZOOM_CLIENT_ID "$ZOOM_CLIENT_ID"
          put_secret ZOOM_CLIENT_SECRET "$ZOOM_CLIENT_SECRET"
          put_secret ZOOM_SCHEDULE_USER_ID "$ZOOM_SCHEDULE_USER_ID"
          put_secret MICROSOFT_TENANT_ID "$MICROSOFT_TENANT_ID"
          put_secret MICROSOFT_CLIENT_ID "$MICROSOFT_CLIENT_ID"
          put_secret MICROSOFT_CLIENT_SECRET "$MICROSOFT_CLIENT_SECRET"
          put_secret MICROSOFT_CALENDAR_USER_ID "$MICROSOFT_CALENDAR_USER_ID"
          put_secret DEVICE_TOKEN "$DEVICE_TOKEN"
          put_secret ADMIN_TOKEN "$ADMIN_TOKEN"

      - name: Remove legacy timing secrets
        if: steps.cloudflare.outputs.deploy == 'true'
        run: |
          set -eu

          for name in \
            POLL_SECONDS \
            SCHEDULE_LOOKAHEAD_MINUTES \
            ACTIVE_MEETING_LOOKAHEAD_MINUTES \
            EMPTY_ROOM_LOOKAHEAD_MINUTES \
            ENDING_SOON_MINUTES
          do
            echo "Removing timing secret if present: $name"
            if printf 'y\n' | npx wrangler secret delete "$name"; then
              echo "Removed legacy timing secret: $name"
            else
              echo "No removable timing secret found: $name"
            fi
          done

      - name: Deploy Worker
        if: steps.cloudflare.outputs.deploy == 'true'
        run: |
          set -eu

          deploy_args=()

          add_var() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              deploy_args+=(--var "$name:$value")
            else
              echo "Using wrangler.toml default for var: $name"
            fi
          }

          active_lookahead="${ACTIVE_MEETING_LOOKAHEAD_MINUTES:-${SCHEDULE_LOOKAHEAD_MINUTES:-}}"
          empty_lookahead="${EMPTY_ROOM_LOOKAHEAD_MINUTES:-${SCHEDULE_LOOKAHEAD_MINUTES:-}}"

          add_var POLL_SECONDS "$POLL_SECONDS"
          add_var ACTIVE_MEETING_LOOKAHEAD_MINUTES "$active_lookahead"
          add_var EMPTY_ROOM_LOOKAHEAD_MINUTES "$empty_lookahead"
          add_var ENDING_SOON_MINUTES "$ENDING_SOON_MINUTES"

          npx wrangler deploy "${deploy_args[@]}"
